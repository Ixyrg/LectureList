<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LectureList - Ma liste de lecture Comics & Mangas</title>
<style>
* {
  box-sizing: border-box;
}

body {
  background: #0a0a0a;
  color: #eee;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0;
  padding: 0;
}

header {
  position: sticky;
  top: 0;
  background: #111;
  padding: 16px 20px 0 20px;
  border-bottom: 1px solid #262626;
  z-index: 20;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

header h1 {
  font-size: 1.3rem;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.progress {
  font-size: 0.85rem;
  color: #999;
  white-space: nowrap;
}

.save-status {
  font-size: 0.75rem;
  color: #4ade80;
  min-width: 70px;
}

/* =========================================================
   NAVIGATION PAR ONGLETS (TABS)
   ========================================================= */

.category-tabs {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  border-bottom: 1px solid #262626;
  overflow-x: auto;
  scrollbar-width: none;
}

.category-tabs::-webkit-scrollbar {
  display: none;
}

.tab-button {
  background: transparent;
  border: none;
  color: #888;
  padding: 10px 16px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  white-space: nowrap;
}

.tab-button:hover {
  color: #ccc;
}

.tab-button.active {
  color: #4ade80;
  border-bottom-color: #4ade80;
}

/* =========================================================
   RECHERCHE ET FILTRES
   ========================================================= */

.search-container {
  margin: 12px 0 16px 0;
  display: flex;
  gap: 8px;
  position: relative;
}

.search-input {
  flex: 1;
  min-width: 0;
  background: #1a1a1a;
  border: 1px solid #333;
  color: #eee;
  padding: 11px 14px;
  border-radius: 10px;
  font-size: 0.95rem;
  outline: none;
}

.search-input:focus {
  border-color: #555;
}

.search-input::placeholder {
  color: #777;
}

.filter-wrapper {
  position: relative;
}

.filter-button {
  width: 44px;
  height: 44px;
  background: #1a1a1a;
  border: 1px solid #333;
  color: #aaa;
  border-radius: 10px;
  cursor: pointer;
  font-size: 19px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.filter-button:hover {
  background: #222;
  color: #fff;
}

.filter-button.active {
  border-color: #4ade80;
  color: #4ade80;
}

.filter-menu {
  position: absolute;
  right: 0;
  top: 50px;
  width: 190px;
  background: #181818;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  display: none;
  z-index: 100;
}

.filter-menu.open {
  display: block;
}

.filter-option {
  width: 100%;
  border: none;
  background: transparent;
  color: #ccc;
  text-align: left;
  padding: 10px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 0.88rem;
}

.filter-option:hover {
  background: #252525;
  color: #fff;
}

.filter-option.selected {
  background: #222;
  color: #4ade80;
}

/* =========================================================
   CONTENU & LISTE
   ========================================================= */

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 16px;
}

.section {
  margin-bottom: 28px;
}

.section-title {
  font-size: 1.1rem;
  font-weight: 700;
  padding: 10px 14px;
  background: #1a1a1a;
  border-radius: 10px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  margin-bottom: 6px;
  background: #141414;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}

.item:hover {
  background: #1c1c1c;
}

.item:active {
  transform: scale(0.99);
}

.checkbox {
  width: 22px;
  height: 22px;
  min-width: 22px;
  border: 2px solid #555;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
}

.checkbox.checked {
  background: #4ade80;
  border-color: #4ade80;
}

.checkbox.checked::after {
  content: "✓";
  color: #0a0a0a;
  font-weight: bold;
  font-size: 14px;
}

.item-text {
  font-size: 0.95rem;
  line-height: 1.4;
  color: #eee;
}

.item.checked .item-text {
  color: #666;
  text-decoration: line-through;
}

.reset-btn {
  background: none;
  border: 1px solid #444;
  color: #999;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
}

.reset-btn:hover {
  background: #222;
  color: #eee;
}

/* =========================================================
   TOMES
   ========================================================= */

.comic-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}

.expand-button {
  width: 22px;
  min-width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  color: #aaa;
  cursor: pointer;
  padding: 0;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s;
}

.expand-button:hover {
  color: #fff;
}

.expand-button.expanded {
  transform: rotate(90deg);
}

.comic-main {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  flex: 1;
}

.volume-count {
  margin-left: auto;
  color: #777;
  font-size: 0.78rem;
  white-space: nowrap;
  padding-left: 8px;
}

.volume-list {
  display: none;
  margin: -2px 0 8px 56px;
  padding: 4px 0 2px 0;
}

.volume-list.open {
  display: block;
}

.volume-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  margin-bottom: 4px;
  background: #101010;
  border-left: 2px solid #2c2c2c;
  border-radius: 0 7px 7px 0;
  cursor: pointer;
}

.volume-item:hover {
  background: #1b1b1b;
}

.volume-checkbox {
  width: 19px;
  height: 19px;
  min-width: 19px;
  border: 2px solid #444;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.volume-checkbox.checked {
  background: #4ade80;
  border-color: #4ade80;
}

.volume-checkbox.checked::after {
  content: "✓";
  color: #0a0a0a;
  font-weight: bold;
  font-size: 12px;
}

.volume-text {
  font-size: 0.88rem;
  color: #bbb;
}

.volume-item.checked .volume-text {
  color: #666;
  text-decoration: line-through;
}

.comic-completed .item-text {
  color: #666;
  text-decoration: line-through;
}

.no-results {
  text-align: center;
  padding: 40px 20px;
  color: #666;
  font-size: 0.95rem;
}

@media (max-width: 600px) {
  header {
    padding: 12px 14px 0 14px;
  }

  header h1 {
    font-size: 1.05rem;
  }

  .header-right {
    gap: 6px;
  }

  .save-status {
    display: none;
  }

  .progress {
    font-size: 0.75rem;
  }

  .reset-btn {
    padding: 6px 8px;
    font-size: 0.72rem;
  }

  .container {
    padding: 12px;
  }

  .search-input {
    font-size: 0.9rem;
  }

  .volume-list {
    margin-left: 38px;
  }

  .volume-count {
    font-size: 0.72rem;
  }
}

<header>
  <div class="header-top">
    <h1>📚 LectureList</h1>
    <div class="header-right">
      <span class="progress" id="progress">0 / 0</span>

    </div>
  </div>

    <button class="tab-button active" data-category="dc" type="button">🦇 Comics DC</button>

    <button class="tab-button" data-category="manga" type="button">⚔️ Mangas</button>
  </div>

  <div class="search-container">
    <input
      type="search"
      id="searchInput"
      class="search-input"
      placeholder="🔎 Rechercher un titre..."
      autocomplete="off"
    >

    <div class="filter-wrapper">
      <button class="filter-button" id="filterButton" type="button" title="Filtrer">⚙️</button>
      <div class="filter-menu" id="filterMenu">
        <button class="filter-option selected" data-filter="all" type="button">📚 Tous</button>
        <button class="filter-option" data-filter="checked" type="button">☑️ Cochés</button>
        <button class="filter-option" data-filter="unchecked" type="button">☐ Non cochés</button>
      </div>
    </div>
  </div>
</header>

<div class="container" id="app">
  <div style="text-align:center; padding:40px; color:#666;">Chargement...</div>
</div>

/* =========================================================
   ÉTAT GLOBAL
   ========================================================= */

const STORAGE_KEY = "lecturelist-checked-v1";

let checkedState = {};
let expandedState = {};
let searchQuery = "";
let currentFilter = "all";
let currentCategory = "dc"; // Catégorie active par défaut (dc, marvel, manga)

/* =========================================================
   GÉNÉRATION DES CLÉS UNIQUES
   ========================================================= */

function volumeKey(category, sectionIndex, itemIndex, volumeIndex) {
  return `vol:${category}:${sectionIndex}:${itemIndex}:${volumeIndex}`;
}

/* =========================================================
   CHARGEMENT & SAUVEGARDE
   ========================================================= */

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      checkedState = JSON.parse(saved);
    }
  } catch (error) {
    console.error("Erreur de chargement :", error);
    checkedState = {};
  }
  render();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedState));
    showSaveStatus("✓ Sauvegardé");
  } catch (error) {
    console.error("Erreur de sauvegarde :", error);
  }
}

function showSaveStatus(message) {
  const status = document.getElementById("saveStatus");
  if (!status) return;
  status.textContent = message;
  clearTimeout(window.saveTimer);
  window.saveTimer = setTimeout(() => {
    status.textContent = "";
  }, 1500);
}

/* =========================================================
   FONCTIONS UTILITAIRES DE VÉRIFICATION
   ========================================================= */

function isVolumeChecked(category, sectionIndex, itemIndex, volumeIndex) {
  return checkedState[volumeKey(category, sectionIndex, itemIndex, volumeIndex)] === true;
}

function getCompletedVolumes(category, sectionIndex, itemIndex, volumes) {
  let completed = 0;
  for (let i = 0; i < volumes; i++) {
    if (isVolumeChecked(category, sectionIndex, itemIndex, i)) {
      completed++;
    }
  }
  return completed;
}

function toggleVolume(category, sectionIndex, itemIndex, volumeIndex) {
  const key = volumeKey(category, sectionIndex, itemIndex, volumeIndex);
  checkedState[key] = !checkedState[key];
  saveState();
  render();
}

function toggleExpanded(category, sectionIndex, itemIndex) {
  const key = `${category}:${sectionIndex}:${itemIndex}`;
  expandedState[key] = !expandedState[key];
  render();
}

function normalizeText(text) {
  return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function setSearchQuery(value) {
  searchQuery = normalizeText(value.trim());
  render();
}

function matchesFilter(category, sectionIndex, itemIndex, volumeIndex) {
  const checked = isVolumeChecked(category, sectionIndex, itemIndex, volumeIndex);
  if (currentFilter === "all") return true;
  if (currentFilter === "checked") return checked;
  if (currentFilter === "unchecked") return !checked;
  return true;
}

function hasVisibleVolumes(category, sectionIndex, itemIndex, item) {
  const volumes = Math.max(1, Number(item.volumes) || 1);
  for (let i = 0; i < volumes; i++) {
    if (matchesFilter(category, sectionIndex, itemIndex, i)) {
      return true;
    }
  }
  return false;
}

function resetAll() {
  if (!confirm("Réinitialiser l'ensemble de vos listes de lecture ?\n\nToutes les cases de toutes les catégories seront décochées.")) {
    return;
  }
  checkedState = {};
  expandedState = {};
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (error) {
    console.error(error);
  }
  render();
  showSaveStatus("Liste réinitialisée");
}

/* =========================================================
   MOTEUR DE RENDU
   ========================================================= */

function render() {
  const app = document.getElementById("app");
  if (!app) return;

  app.innerHTML = "";

  const currentData = database[currentCategory] || [];

  let totalVolumes = 0;
  let completedVolumes = 0;
  let visibleItems = 0;

  currentData.forEach((section, sectionIndex) => {
    // Vérification présence recherche
    const hasSearchResult = section.items.some(item => 
      !searchQuery || normalizeText(item.title).includes(searchQuery)
    );

    if (searchQuery && !hasSearchResult) return;

    const sectionDiv = document.createElement("div");
    sectionDiv.className = "section";

    const titleDiv = document.createElement("div");
    titleDiv.className = "section-title";
    titleDiv.textContent = section.title;
    sectionDiv.appendChild(titleDiv);

    let sectionHasVisibleItem = false;

    section.items.forEach((item, itemIndex) => {
      if (searchQuery && !normalizeText(item.title).includes(searchQuery)) {
        return;
      }

      const volumes = Math.max(1, Number(item.volumes) || 1);
      const completed = getCompletedVolumes(currentCategory, sectionIndex, itemIndex, volumes);

      totalVolumes += volumes;
      completedVolumes += completed;

      if (volumes > 1 && !hasVisibleVolumes(currentCategory, sectionIndex, itemIndex, item)) {
        return;
      }

      if (volumes === 1 && !matchesFilter(currentCategory, sectionIndex, itemIndex, 0)) {
        return;
      }

      sectionHasVisibleItem = true;
      visibleItems++;

      const complete = completed === volumes;
      const expandKey = `${currentCategory}:${sectionIndex}:${itemIndex}`;
      const expanded = expandedState[expandKey] === true;

      const wrapper = document.createElement("div");

      const itemDiv = document.createElement("div");
      itemDiv.className = "item" + (complete ? " checked comic-completed" : "");

      const comicRow = document.createElement("div");
      comicRow.className = "comic-row";

      // Bouton Flèche (si plusieurs tomes)
      if (volumes > 1) {
        const arrow = document.createElement("button");
        arrow.type = "button";
        arrow.className = "expand-button" + (expanded ? " expanded" : "");
        arrow.textContent = "▶";
        arrow.title = expanded ? "Masquer les tomes" : "Afficher les tomes";

        arrow.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleExpanded(currentCategory, sectionIndex, itemIndex);
        });

        comicRow.appendChild(arrow);
      } else {
        const spacer = document.createElement("div");
        spacer.style.width = "22px";
        spacer.style.minWidth = "22px";
        comicRow.appendChild(spacer);
      }

      // Checkbox principal & Titre
      const comicMain = document.createElement("div");
      comicMain.className = "comic-main";

      const checkbox = document.createElement("div");
      checkbox.className = "checkbox" + (complete ? " checked" : "");

      const text = document.createElement("div");
      text.className = "item-text";
      text.textContent = item.title;

      comicMain.appendChild(checkbox);
      comicMain.appendChild(text);
      comicRow.appendChild(comicMain);

      // Compteur de tomes
      if (volumes > 1) {
        const counter = document.createElement("div");
        counter.className = "volume-count";
        counter.textContent = `${completed}/${volumes}`;
        comicRow.appendChild(counter);
      }

      itemDiv.appendChild(comicRow);

      // Action au clic sur la ligne
      itemDiv.addEventListener("click", () => {
        if (volumes > 1) {
          toggleExpanded(currentCategory, sectionIndex, itemIndex);
        } else {
          toggleVolume(currentCategory, sectionIndex, itemIndex, 0);
        }
      });

      wrapper.appendChild(itemDiv);

      // Sous-liste des tomes
      if (volumes > 1 && expanded) {
        const volumeList = document.createElement("div");
        volumeList.className = "volume-list open";

        for (let volumeIndex = 0; volumeIndex < volumes; volumeIndex++) {
          if (!matchesFilter(currentCategory, sectionIndex, itemIndex, volumeIndex)) {
            continue;
          }

          const checked = isVolumeChecked(currentCategory, sectionIndex, itemIndex, volumeIndex);

          const volumeItem = document.createElement("div");
          volumeItem.className = "volume-item" + (checked ? " checked" : "");

          volumeItem.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleVolume(currentCategory, sectionIndex, itemIndex, volumeIndex);
          });

          const volumeCheckbox = document.createElement("div");
          volumeCheckbox.className = "volume-checkbox" + (checked ? " checked" : "");

          const volumeText = document.createElement("div");
          volumeText.className = "volume-text";
          volumeText.textContent = `Tome ${volumeIndex + 1}`;

          volumeItem.appendChild(volumeCheckbox);
          volumeItem.appendChild(volumeText);
          volumeList.appendChild(volumeItem);
        }

        wrapper.appendChild(volumeList);
      }

      sectionDiv.appendChild(wrapper);
    });

    if (sectionHasVisibleItem) {
      app.appendChild(sectionDiv);
    }
  });

  // Message si aucun résultat
  if (visibleItems === 0) {
    const noResults = document.createElement("div");
    noResults.className = "no-results";

    if (currentFilter === "checked") {
      noResults.textContent = "☑️ Aucun élément coché dans cette catégorie.";
    } else if (currentFilter === "unchecked") {
      noResults.textContent = "☐ Tous les éléments sont cochés dans cette catégorie !";
    } else {
      noResults.textContent = "🔎 Aucun élément trouvé.";
    }

    app.appendChild(noResults);
  }

  // Progression globale de la catégorie
  const progress = document.getElementById("progress");
  if (progress) {
    progress.textContent = `${completedVolumes} / ${totalVolumes}`;
  }
}

/* =========================================================
   ÉVÉNEMENTS & INITIALISATION
   ========================================================= */

// Onglets de catégories
document.querySelectorAll(".tab-button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab-button").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    currentCategory = button.dataset.category;
    render();
  });
});

// Menu Filtre
const filterButton = document.getElementById("filterButton");
const filterMenu = document.getElementById("filterMenu");

filterButton.addEventListener("click", (e) => {
  e.stopPropagation();
  filterMenu.classList.toggle("open");
});

filterMenu.addEventListener("click", (e) => {
  e.stopPropagation();
});

document.querySelectorAll(".filter-option").forEach(button => {
  button.addEventListener("click", () => {
    currentFilter = button.dataset.filter;
    document.querySelectorAll(".filter-option").forEach(opt => opt.classList.remove("selected"));
    button.classList.add("selected");
    filterButton.classList.toggle("active", currentFilter !== "all");
    filterMenu.classList.remove("open");
    render();
  });
});

document.addEventListener("click", () => {
  filterMenu.classList.remove("open");
});

// Champ de recherche
document.getElementById("searchInput").addEventListener("input", (e) => {
  setSearchQuery(e.target.value);
});

// Bouton Réinitialiser
document.getElementById("resetButton").addEventListener("click", resetAll);

// Lancement
loadState();
</script>
